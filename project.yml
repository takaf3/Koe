name: Koe
options:
  bundleIdPrefix: com.takaf3
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Koe:
    type: application
    platform: macOS
    sources: [Koe]
    info:
      path: Koe/Info.plist
      properties:
        CFBundleDisplayName: Koe
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'
        CFBundleIconFile: Koe
        LSUIElement: true
        NSMicrophoneUsageDescription: Koe uses your microphone to transcribe English, Japanese, and French speech on this Mac.
        NSPrincipalClass: NSApplication
    entitlements:
      path: Koe/Koe.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takaf3.Koe
        PRODUCT_NAME: Koe
        ENABLE_APP_SANDBOX: NO
  KoeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [KoeTests]
    dependencies:
      - target: Koe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Koe:
    build:
      targets:
        Koe: all
        KoeTests: [test]
    test:
      targets: [KoeTests]
